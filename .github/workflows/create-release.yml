name: Create release

on:
  push:
    # Unfortunately these filters are OR-combined
    #branches:
    #  - main
    #tags:
    #  - v*

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Check-out
        # version 5.0.0: https://github.com/actions/checkout/commit/08c6903cd8c0fde910a37f88322edcfb5dd907a8
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-tags: true

      - name: Debuggin'
        env:
          ref_name: ${{ github.ref_name }}
          ref: ${{ github.ref }}
        run: |
          echo 'ref_name $ref_name'
          echo 'ref $ref'
          git describe --tags
          git describe --all
          git describe

