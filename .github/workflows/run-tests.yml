name: Run tests

on:
  pull_request:
  push:
    branches: ['!main']

jobs:
  run-tests:
    #runs-on: ubuntu-latest
    runs-on: texlive/texlive:TL2024-historic
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Install dependencies
        run: sudo apt install pandoc -y

      - name: Check-out
        # version 5.0.0: https://github.com/actions/checkout/commit/08c6903cd8c0fde910a37f88322edcfb5dd907a8
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Run tests
        run: ./run-tests.sh

      - name: Test package building
        run: ./build-packages.sh
